[package]
name = "writing-space"
version = "0.1.0"
edition = "2021"
description = "A collaborative writing and research workspace"
license = "UNLICENSED"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "HtmlElement"] }
